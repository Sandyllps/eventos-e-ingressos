[defaults]

#arquivo que identifica as máquinas gerenciadas
inventory = inventory.ini

#usuário utilizado para acessar a VM2
remote_user = vagrant

#chave privada criada na VM1
private_key_file = /home/vagrant/.ssh/id_ed25519

#evita perguntas de confirmacao na primeira conexao ssh
host_key_checking = False

#tempo máx de espera pela conexao ssh
timeout = 30
